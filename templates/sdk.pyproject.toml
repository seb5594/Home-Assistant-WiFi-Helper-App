[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-wifi-helper-client"
version = "@@SDK_VERSION@@"
description = "Authenticated local client for the Home Assistant WiFi Namespace Helper"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.package-data]
wifi_helper = ["build_info.json"]
